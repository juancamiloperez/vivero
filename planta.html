<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#2D5016">
<title>Ficha de Planta — Vivero Multigrupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--verde:#2D5016;--verde-claro:#4A7A28;--crema:#F8F4E8;--crema-oscura:#EDE8D5;--blanco:#FDFAF4;--musgo:#6B7B5E;--texto:#1C2B10;--texto-suave:#4A5A3A;--borde:#D5CEB8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--crema);color:var(--texto);min-height:100vh}

/* HEADER */
.client-header{background:var(--verde);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.client-logo-wrap{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.client-logo-wrap img{width:100%;height:100%;object-fit:contain}
.client-header-text{color:white;flex:1}
.client-header-text strong{display:block;font-size:.97rem;font-weight:600}
.client-header-text span{font-size:.7rem;opacity:.7;letter-spacing:.06em;text-transform:uppercase}

/* HERO IMAGE */
.plant-hero{width:100%;height:260px;background:var(--crema-oscura);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.plant-hero img{width:100%;height:100%;object-fit:cover}
.plant-hero-placeholder{font-size:6rem;opacity:.2}
.type-stripe{position:absolute;bottom:0;left:0;right:0;height:5px}
.type-stripe.arbol{background:#2D5016}.type-stripe.arbusto{background:#4A7A28}
.type-stripe.herbacea,.type-stripe.herbácea{background:#7BAE3E}
.type-stripe.suculenta{background:#C4845A}.type-stripe.trepadora{background:#6B7B5E}
.type-stripe.palma{background:#A0522D}.type-stripe.cactus{background:#8B6914}
.type-stripe.acuatica,.type-stripe.acuática{background:#2980B9}

/* CONTENT */
.plant-content{padding:22px 18px 50px;max-width:640px;margin:0 auto}

/* TOP INFO */
.plant-id-badge{display:inline-block;background:var(--crema-oscura);color:var(--musgo);font-size:.68rem;padding:3px 10px;border-radius:20px;font-weight:600;letter-spacing:.06em;margin-bottom:8px}
.plant-code{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--musgo);margin-bottom:5px}
.plant-name{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;line-height:1.2;color:var(--texto);margin-bottom:5px}
.plant-sci{font-family:'Playfair Display',serif;font-style:italic;color:var(--musgo);font-size:.95rem;margin-bottom:6px}
.plant-familia{font-size:.82rem;color:var(--texto-suave);margin-bottom:16px}

.plant-price{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--verde);margin-bottom:20px;display:flex;align-items:baseline;gap:8px}
.plant-price span{font-size:.85rem;font-weight:400;color:var(--musgo)}

/* TAGS */
.plant-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.ptag{padding:5px 13px;border-radius:20px;font-size:.78rem;border:1.5px solid var(--borde);color:var(--musgo);background:white;font-weight:500}
.ptag.verde{background:#D4EDDA;border-color:#28A745;color:#155724}
.ptag.sol{background:#FFF3CD;border-color:#F0AD4E;color:#856404}
.ptag.agua{background:#D1ECF1;border-color:#17A2B8;color:#0C5460}
.ptag.tipo{background:var(--crema);border-color:var(--verde-claro);color:var(--verde)}

/* DESCRIPTION */
.plant-desc{background:white;border-radius:12px;padding:15px 17px;color:var(--texto-suave);font-size:.9rem;line-height:1.7;margin-bottom:22px;border:1px solid var(--borde)}

/* SECTION */
.section-title{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--musgo);margin-bottom:10px;margin-top:24px}

/* CARE GRID */
.care-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.care-card{background:white;border:1px solid var(--borde);border-radius:12px;padding:13px 15px}
.care-icon{font-size:1.3rem;margin-bottom:4px}
.care-label{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--musgo);margin-bottom:3px}
.care-value{font-size:.86rem;font-weight:500;color:var(--texto);line-height:1.3}

/* CARE SUMMARY BOX */
.care-box{background:linear-gradient(135deg,var(--verde) 0%,var(--verde-claro) 100%);border-radius:14px;padding:18px 20px;margin-bottom:22px;color:white}
.care-box h3{font-family:'Playfair Display',serif;font-size:1rem;margin-bottom:12px}
.care-item{display:flex;gap:10px;margin-bottom:9px;align-items:flex-start}
.care-item:last-child{margin-bottom:0}
.care-item-icon{font-size:1rem;flex-shrink:0;margin-top:2px}
.care-item-text strong{display:block;font-size:.72rem;opacity:.75;font-weight:500}
.care-item-text span{font-size:.87rem}

/* METADATA TABLE */
.meta-table{width:100%;border-collapse:collapse;margin-bottom:22px;background:white;border-radius:12px;overflow:hidden;border:1px solid var(--borde)}
.meta-table tr:not(:last-child) td{border-bottom:1px solid var(--borde)}
.meta-table td{padding:10px 14px;font-size:.82rem;vertical-align:top}
.meta-table td:first-child{font-weight:600;color:var(--musgo);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;width:38%;white-space:nowrap}
.meta-table td:last-child{color:var(--texto-suave);word-break:break-all}

/* QR SECTION */
.qr-block{background:var(--crema-oscura);border-radius:12px;padding:16px;display:flex;align-items:center;gap:16px;margin-bottom:22px;border:1px solid var(--borde)}
.qr-block img{width:90px;height:90px;border-radius:8px;background:white;padding:4px;flex-shrink:0}
.qr-block-info{flex:1}
.qr-block-info p{font-size:.78rem;color:var(--musgo);line-height:1.5;margin-bottom:6px}
.qr-url-text{font-size:.65rem;color:var(--musgo);background:white;padding:4px 8px;border-radius:6px;word-break:break-all;border:1px solid var(--borde);display:block}

/* FOOTER */
.client-footer{text-align:center;padding:20px 16px;border-top:1px solid var(--borde);color:var(--musgo);font-size:.78rem;line-height:1.6}
.client-footer strong{color:var(--verde);display:block;font-size:.9rem;margin-bottom:4px}

/* STATES */
.state-screen{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
.state-icon{font-size:4rem;margin-bottom:16px;opacity:.4}
.state-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--texto-suave);margin-bottom:8px}
.state-sub{font-size:.85rem;color:var(--musgo);line-height:1.6;max-width:320px}
.spinner{width:40px;height:40px;border:3px solid var(--borde);border-top-color:var(--verde);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(min-width:480px){
  .plant-name{font-size:2.2rem}
  .care-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="client-header">
  <div class="client-logo-wrap" id="clientLogoWrap">🌿</div>
  <div class="client-header-text">
    <strong>Vivero Multigrupo</strong>
    <span>Catálogo de Plantas</span>
  </div>
</div>

<!-- CONTENIDO DINÁMICO -->
<div id="appContent">
  <div class="state-screen">
    <div class="spinner"></div>
    <div class="state-title">Cargando ficha…</div>
    <div class="state-sub">Buscando información de la planta.</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
//  ⚙️  CONFIGURACIÓN — mismo valor que en index.html
// ═══════════════════════════════════════════════════
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx6XFy6tnyz5AVpXYZGnb57bd5VMwR4JuZGSrd07VV5QFNFhNjQb8nRouPzheyMwtjHKg/exec'; // ← pega tu URL de Apps Script

const LOGO_KEY  = 'vivero_logo_v1';
const CONFIGURED = SCRIPT_URL !== 'TU_SCRIPT_URL_AQUI';

// ── Logo ──
async function loadLogo() {
  const cached = localStorage.getItem(LOGO_KEY);
  if (cached) applyLogo(cached);
  if (!CONFIGURED) return;
  try {
    const r = await fetch(SCRIPT_URL + '?action=getLogo');
    const d = await r.json();
    if (d.ok && d.logo) { localStorage.setItem(LOGO_KEY, d.logo); applyLogo(d.logo); }
  } catch(e) {}
}
function applyLogo(dataUrl) {
  const w = document.getElementById('clientLogoWrap');
  if (w) w.innerHTML = '<img src="' + dataUrl + '" alt="Logo">';
}

// ── Código desde URL ──
function getCodigo() {
  const p = new URLSearchParams(window.location.search);
  return p.get('codigo') || p.get('planta') || '';
}

// ── Fetch planta ──
async function fetchPlanta(codigo) {
  const r = await fetch(SCRIPT_URL + '?action=getOne&codigo=' + encodeURIComponent(codigo));
  const d = await r.json();
  if (!d.ok) return null;
  return d.plant;
}

// ── Helpers ──
function fmt(v) { return (v && v.toString().trim()) ? v : null; }
function fmtPrecio(v) { if (!fmt(v) || v === '0') return null; return '$' + Number(v).toLocaleString('es-CO'); }
function tipoClass(t) { return (t||'').toLowerCase().replace(/[áa]/g,'a').replace(/[ée]/g,'e').replace(/[óo]/g,'o').replace(/\s+/g,'-'); }
function fmtDate(s) {
  if (!s) return null;
  try { return new Date(s).toLocaleDateString('es-CO', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
  catch(e) { return s; }
}

// ── Render principal ──
function renderPlanta(p) {
  const precio   = fmtPrecio(p.precio);
  const tc       = tipoClass(p.tipo);
  const heroImg  = fmt(p.imagen_url)
    ? `<img src="${p.imagen_url}" alt="${p.nombre}" loading="eager">`
    : `<div class="plant-hero-placeholder">🌿</div>`;

  // Tags visuales
  const tags = [
    p.tipo     && `<span class="ptag tipo">${p.tipo}</span>`,
    p.familia  && `<span class="ptag">${p.familia}</span>`,
    p.luz==='Alta'   && `<span class="ptag sol">☀️ Pleno sol</span>`,
    p.luz==='Media'  && `<span class="ptag verde">🌤 Sol parcial</span>`,
    p.luz==='Sombra' && `<span class="ptag agua">🌧 Sombra</span>`,
    p.riego==='Abundante' && `<span class="ptag agua">💧💧 Riego abundante</span>`,
    p.riego==='Moderado'  && `<span class="ptag verde">💧 Riego moderado</span>`,
    p.riego==='Escaso'    && `<span class="ptag sol">🏜 Riego escaso</span>`,
  ].filter(Boolean).join('');

  // Tarjetas de cuidado
  const careCards = [
    fmt(p.luz)           && { icon:'☀️', label:'Req. de Luz',      value: p.luz },
    fmt(p.riego)         && { icon:'💧', label:'Tipo de Riego',    value: p.riego },
    fmt(p.frecuencia)    && { icon:'📅', label:'Frecuencia',       value: p.frecuencia },
    fmt(p.fertilizacion) && { icon:'🌱', label:'Fertilización',    value: p.fertilizacion },
    fmt(p.poda)          && { icon:'✂️', label:'Poda',             value: p.poda },
    fmt(p.tipo)          && { icon:'🌿', label:'Tipo de Planta',   value: p.tipo },
  ].filter(Boolean);

  const careGridHtml = careCards.length ? `
    <div class="section-title">Información de Cuidado</div>
    <div class="care-grid">
      ${careCards.map(c => `
        <div class="care-card">
          <div class="care-icon">${c.icon}</div>
          <div class="care-label">${c.label}</div>
          <div class="care-value">${c.value}</div>
        </div>`).join('')}
    </div>` : '';

  // Resumen de cuidado
  const careBoxItems = [
    fmt(p.riego)         && `<div class="care-item"><div class="care-item-icon">💧</div><div class="care-item-text"><strong>Riego</strong><span>${p.riego}${fmt(p.frecuencia) ? ' · ' + p.frecuencia : ''}</span></div></div>`,
    fmt(p.fertilizacion) && `<div class="care-item"><div class="care-item-icon">🌱</div><div class="care-item-text"><strong>Fertilización</strong><span>${p.fertilizacion}</span></div></div>`,
    fmt(p.poda)          && `<div class="care-item"><div class="care-item-icon">✂️</div><div class="care-item-text"><strong>Poda recomendada</strong><span>${p.poda}</span></div></div>`,
    fmt(p.luz)           && `<div class="care-item"><div class="care-item-icon">☀️</div><div class="care-item-text"><strong>Luz necesaria</strong><span>${p.luz}</span></div></div>`,
  ].filter(Boolean);

  const careBoxHtml = careBoxItems.length ? `
    <div class="care-box">
      <h3>🌱 Guía de cuidado rápida</h3>
      ${careBoxItems.join('')}
    </div>` : '';

  // Tabla de metadatos (todos los campos del sistema)
  const metaRows = [
    { label: 'ID interno',       value: fmt(p.id) },
    { label: 'Código PLU',       value: fmt(p.codigo) },
    { label: 'Nombre',           value: fmt(p.nombre) },
    { label: 'Nombre científico',value: fmt(p.cientifico) },
    { label: 'Familia botánica', value: fmt(p.familia) },
    { label: 'Tipo de planta',   value: fmt(p.tipo) },
    { label: 'Luz requerida',    value: fmt(p.luz) },
    { label: 'Tipo de riego',    value: fmt(p.riego) },
    { label: 'Frecuencia riego', value: fmt(p.frecuencia) },
    { label: 'Fertilización',    value: fmt(p.fertilizacion) },
    { label: 'Poda',             value: fmt(p.poda) },
    { label: 'Precio unitario',  value: precio },
    { label: 'URL de imagen',    value: fmt(p.imagen_url) },
    { label: 'URL del QR',       value: fmt(p.qr_url) },
    { label: 'Creado',           value: fmtDate(p.created_at) },
    { label: 'Actualizado',      value: fmtDate(p.updated_at) },
  ].filter(r => r.value);

  const metaHtml = metaRows.length ? `
    <div class="section-title">Ficha técnica completa</div>
    <table class="meta-table">
      ${metaRows.map(r => `<tr><td>${r.label}</td><td>${r.value}</td></tr>`).join('')}
    </table>` : '';

  // QR visual
  const qrHtml = fmt(p.qr_url) ? `
    <div class="section-title">Código QR</div>
    <div class="qr-block">
      <div id="clientQrBox" style="background:white;padding:6px;border-radius:8px;flex-shrink:0"></div>
      <div class="qr-block-info">
        <p>Escanea este QR para compartir la ficha de esta planta.</p>
        <span class="qr-url-text">${p.qr_url}</span>
      </div>
    </div>` : '';

  document.getElementById('appContent').innerHTML = `
    <div class="plant-hero">${heroImg}<div class="type-stripe ${tc}"></div></div>
    <div class="plant-content">

      <div class="plant-id-badge">ID: ${p.id || '—'}</div>
      <div class="plant-code">${p.codigo}</div>
      <div class="plant-name">${p.nombre}</div>
      ${fmt(p.cientifico) ? `<div class="plant-sci">${p.cientifico}</div>` : ''}
      ${fmt(p.familia)    ? `<div class="plant-familia">Familia: ${p.familia}</div>` : ''}
      ${precio            ? `<div class="plant-price">${precio}<span>precio unitario</span></div>` : ''}
      ${tags              ? `<div class="plant-tags">${tags}</div>` : ''}
      ${fmt(p.descripcion)? `<div class="plant-desc">${p.descripcion}</div>` : ''}

      ${careGridHtml}
      ${careBoxHtml}
      ${qrHtml}
      ${metaHtml}

      <div class="client-footer">
        <strong>Vivero Multigrupo</strong>
        Gracias por tu interés en esta planta 🌿<br>
        <span style="font-size:.7rem;opacity:.7">Escanea el QR de cualquier planta para ver su ficha completa</span>
      </div>
    </div>`;

  document.title = p.nombre + ' — Vivero Multigrupo';

  // Generar QR visual en la página del cliente
  if (fmt(p.qr_url)) {
    setTimeout(() => {
      const box = document.getElementById('clientQrBox');
      if (box) {
        try {
          new QRCode(box, {
            text: p.qr_url, width: 90, height: 90,
            colorDark: '#2D5016', colorLight: '#FFFFFF',
            correctLevel: 2
          });
        } catch(e) {
          box.innerHTML = '<div style="font-size:.7rem;color:#888;padding:8px">QR</div>';
        }
      }
    }, 200);
  }
}

// ── Estados de error / vacío ──
function renderError(codigo) {
  document.getElementById('appContent').innerHTML = `
    <div class="state-screen">
      <div class="state-icon">🔍</div>
      <div class="state-title">Planta no encontrada</div>
      <div class="state-sub">No encontramos la planta con código <strong>${codigo||'(vacío)'}</strong>.<br>Verifica que el QR esté en buen estado o consulta a un asesor del vivero.</div>
    </div>`;
}
function renderNoCode() {
  document.getElementById('appContent').innerHTML = `
    <div class="state-screen">
      <div class="state-icon">📷</div>
      <div class="state-title">Escanea el QR de una planta</div>
      <div class="state-sub">Esta página muestra la ficha técnica completa de cada planta. Apunta la cámara de tu celular al código QR de la etiqueta.</div>
    </div>`;
}
function renderNotConfigured() {
  document.getElementById('appContent').innerHTML = `
    <div class="state-screen">
      <div class="state-icon">⚙️</div>
      <div class="state-title">Catálogo no configurado</div>
      <div class="state-sub">El administrador debe conectar Google Sheets y pegar la SCRIPT_URL en este archivo.</div>
    </div>`;
}

// ── INIT ──
async function init() {
  loadLogo();
  const codigo = getCodigo();
  if (!codigo)     { renderNoCode();       return; }
  if (!CONFIGURED) { renderNotConfigured(); return; }
  try {
    const planta = await fetchPlanta(codigo);
    if (planta) renderPlanta(planta);
    else        renderError(codigo);
  } catch(e) {
    renderError(codigo);
  }
}

init();
</script>
<!-- QR library para mostrar el QR visualmente en la ficha -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>
</html>
